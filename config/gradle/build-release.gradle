/**
 * Release configuration for Yoko project
 * 
 * This file provides Gradle tasks for creating GitHub releases with binaries.
 * Usage:
 *   ./gradlew assembleRelease    - Build all release artifacts
 *   ./gradlew generateReleaseNotes - Generate release notes from CHANGELOG
 *   ./gradlew createGitHubRelease  - Create GitHub release (requires GH_TOKEN)
 *   ./gradlew release              - Complete release process
 */

// Define release artifacts
def releaseProjects = [
    ':yoko-osgi',
    ':yoko-util',
    ':yoko-spec-corba',
    ':yoko-rmi-spec',
    ':yoko-rmi-impl',
    ':yoko-core'
]

// Helper function to get latest version from git tags (only in ancestry)
def getLatestVersionFromGit() {
    try {
        // Get all tags that are reachable from HEAD (in ancestry)
        def tagsOutput = 'git tag --merged HEAD'.execute().text.trim()
        if (!tagsOutput) {
            return '0.0.0'
        }

        def versionPattern = /^v?(\d+\.\d+\.\d+)$/
        def versions = tagsOutput.split('\n')
            .findAll { it =~ versionPattern }
            .collect { tag ->
                def matcher = tag =~ versionPattern
                matcher.matches() ? matcher.group(1) : null
            }
            .findAll { it != null }

        if (versions.isEmpty()) {
            return '0.0.0'
        }

        // Sort versions semantically and return the highest
        return versions.sort { a, b ->
            def aParts = a.split('\\.').collect { it.toInteger() }
            def bParts = b.split('\\.').collect { it.toInteger() }

            for (int i = 0; i < 3; i++) {
                if (aParts[i] != bParts[i]) {
                    return aParts[i] <=> bParts[i]
                }
            }
            return 0
        }.last()
    } catch (Exception e) {
        return '0.0.0'
    }
}

// Helper function to get all version tags from git (not just in ancestry)
def getAllVersionTagsFromGit() {
    try {
        def tagsOutput = 'git tag'.execute().text.trim()
        if (!tagsOutput) {
            return []
        }

        def versionPattern = /^v?(\d+\.\d+\.\d+)$/
        return tagsOutput.split('\n')
            .findAll { it =~ versionPattern }
            .collect { tag ->
                def matcher = tag =~ versionPattern
                matcher.matches() ? matcher.group(1) : null
            }
            .findAll { it != null }
    } catch (Exception e) {
        return []
    }
}



// Task to verify release prerequisites
task verifyReleasePrerequisites {
    group = 'release'
    description = 'Verifies all prerequisites for creating a release'

    doLast {
        def errors = []
        def warnings = []

        // Check version format (semantic versioning)
        def versionPattern = /^\d+\.\d+\.\d+$/
        if (!(version ==~ versionPattern)) {
            errors.add("Version '${version}' doesn't match semantic versioning format (X.Y.Z)")
        }

        // Check CHANGELOG.md exists and has current version
        def changelogFile = file('CHANGELOG.md')
        if (!changelogFile.exists()) {
            errors.add("CHANGELOG.md not found")
        } else {
            def changelog = changelogFile.text
            if (!changelog.contains("## [v${version}]") && !changelog.contains("## [${version}]")) {
                errors.add("Version ${version} not found in CHANGELOG.md. Run './gradlew updateChangelog' first.")
            }
        }

        // Check for git-cliff
        try {
            exec {
                commandLine 'git-cliff', '--version'
                standardOutput = new ByteArrayOutputStream()
            }
        } catch (Exception e) {
            warnings.add("git-cliff not found. Install from: https://git-cliff.org/docs/installation (optional for manual releases)")
        }

        // Check for clean git state
        try {
            def gitStatus = 'git status --porcelain'.execute().text.trim()
            if (gitStatus) {
                errors.add("Git working directory is not clean. Commit or stash changes first.")
            }
        } catch (Exception e) {
            errors.add("Unable to check git status: ${e.message}")
        }

        // Check git tag doesn't already exist
        try {
            def checkTag = "git rev-parse --verify v${version}".execute()
            checkTag.waitFor()
            if (checkTag.exitValue() == 0) {
                errors.add("Git tag v${version} already exists. Use a different version or delete the tag.")
            }
        } catch (Exception e) {
            // Tag doesn't exist - this is good
        }

        // Check for GitHub CLI
        try {
            exec {
                commandLine 'gh', '--version'
                standardOutput = new ByteArrayOutputStream()
            }
        } catch (Exception e) {
            errors.add("GitHub CLI (gh) not found. Install from: https://cli.github.com/")
        }

        // Check for GH_TOKEN or gh auth
        def hasToken = System.getenv('GH_TOKEN') != null
        def hasAuth = false
        try {
            def authStatus = 'gh auth status'.execute()
            authStatus.waitFor()
            hasAuth = authStatus.exitValue() == 0
        } catch (Exception e) {
            // Ignore
        }

        if (!hasToken && !hasAuth) {
            errors.add("GitHub authentication not configured. Run 'gh auth login' or set GH_TOKEN environment variable")
        }

        // Check GitHub release doesn't already exist
        if (hasToken || hasAuth) {
            try {
                def checkRelease = "gh release view v${version}".execute()
                def output = new ByteArrayOutputStream()
                checkRelease.consumeProcessOutput(output, output)
                checkRelease.waitFor()
                if (checkRelease.exitValue() == 0) {
                    errors.add("GitHub release v${version} already exists. Use a different version or delete the release.")
                }
            } catch (Exception e) {
                // Release doesn't exist - this is good
            }
        }

        if (warnings) {
            println "⚠️  Warnings:"
            warnings.each { println "  - ${it}" }
        }

        if (errors) {
            throw new GradleException("Release prerequisites not met:\n  - " + errors.join('\n  - '))
        }

        println "✅ All release prerequisites verified"
        println "   Version: ${version}"
        println "   Tag: v${version}"
    }
}

// Task to assemble all release artifacts
task assembleRelease {
    group = 'release'
    description = 'Assembles all release artifacts (JARs)'
    
    dependsOn verifyReleasePrerequisites
    dependsOn releaseProjects.collect { "${it}:jar" }
    dependsOn releaseProjects.collect { "${it}:sourcesJar" }
    dependsOn releaseProjects.collect { "${it}:javadocJar" }
    
    doLast {
        def releaseDir = file("${buildDir}/release")
        
        // Clean release directory to remove old artifacts
        if (releaseDir.exists()) {
            println "Cleaning old release artifacts from: ${releaseDir}"
            delete releaseDir
        }
        releaseDir.mkdirs()
        
        // Copy all JARs to release directory
        releaseProjects.each { projectPath ->
            def proj = project(projectPath)
            copy {
                from proj.tasks.jar.archiveFile
                from proj.tasks.sourcesJar.archiveFile
                from proj.tasks.javadocJar.archiveFile
                into releaseDir
            }
        }
        
        // Create checksums
        fileTree(releaseDir).matching { include '*.jar' }.each { file ->
            ant.checksum(file: file, algorithm: 'SHA-256', fileext: '.sha256')
            ant.checksum(file: file, algorithm: 'SHA-512', fileext: '.sha512')
        }
        
        println "Release artifacts assembled in: ${releaseDir}"
        println "Total artifacts: ${fileTree(releaseDir).matching { include '*.jar' }.files.size()}"
    }
}

// Task to update CHANGELOG using git-cliff
task updateChangelog {
    group = 'release'
    description = 'Updates CHANGELOG.md using git-cliff'
    
    def changelogFile = file('CHANGELOG.md')
    def cliffConfig = file('config/git-cliff/cliff.toml')
    
    inputs.file cliffConfig
    outputs.file changelogFile
    
    doLast {
        // Check if git-cliff is available
        try {
            exec {
                commandLine 'git-cliff', '--version'
                standardOutput = new ByteArrayOutputStream()
            }
        } catch (Exception e) {
            throw new GradleException("git-cliff not found. Install from: https://git-cliff.org/docs/installation")
        }

        println "Updating CHANGELOG.md using git-cliff for v${version}..."
        
        // Run git-cliff to update only unreleased changes, preserving existing entries
        // Use --unreleased to only add new changes since the last tag
        exec {
            commandLine 'git-cliff', '--config', cliffConfig.absolutePath, '--tag', "v${version}", '--unreleased', '--prepend', changelogFile.absolutePath
        }
        
        println "✅ CHANGELOG.md updated successfully"
    }
}

// Task to bump version non-interactively (for CI/CD)
task bumpVersionNonInteractive {
    group = 'release'
    description = 'Bump version non-interactively. Usage: -PversionBump=major|minor|patch'
    
    doLast {
        def bumpType = project.findProperty('versionBump')
        if (!bumpType || !(bumpType in ['major', 'minor', 'patch'])) {
            throw new GradleException("Must specify -PversionBump=major|minor|patch")
        }
        
        // Get current version from git tags (only in ancestry)
        def currentVersion = getLatestVersionFromGit()
        
        def versionPattern = /^(\d+)\.(\d+)\.(\d+)$/
        def matcher = currentVersion =~ versionPattern
        
        if (!matcher.matches()) {
            throw new GradleException("Version '${currentVersion}' doesn't match semantic versioning format (X.Y.Z)")
        }
        
        def major = matcher.group(1).toInteger()
        def minor = matcher.group(2).toInteger()
        def patch = matcher.group(3).toInteger()
        
        def newVersion
        switch(bumpType) {
            case 'major':
                newVersion = "${major + 1}.0.0"
                break
            case 'minor':
                newVersion = "${major}.${minor + 1}.0"
                break
            case 'patch':
                newVersion = "${major}.${minor}.${patch + 1}"
                break
        }
        
        // Check if the new version would conflict with existing versions
        def allVersions = getAllVersionTagsFromGit()

        // Validate based on bump type using same logic as interactive task
        if (bumpType == 'major') {
            // Check if there are any higher versions in the current major version line
            def higherInCurrentMajor = allVersions.any { otherVersion ->
                def otherMatcher = otherVersion =~ versionPattern
                if (!otherMatcher.matches()) return false
                def otherMajor = otherMatcher.group(1).toInteger()
                def otherMinor = otherMatcher.group(2).toInteger()
                def otherPatch = otherMatcher.group(3).toInteger()

                return otherMajor == major && (otherMinor > minor || (otherMinor == minor && otherPatch > patch))
            }

            if (higherInCurrentMajor) {
                throw new GradleException("""
Cannot bump major version: higher versions exist in current major version line!

Current version: ${currentVersion} (from ancestry)
Requested bump: major → ${newVersion}

Higher versions exist in the ${major}.x.x line that are not in your branch ancestry.
You must merge/rebase to include all ${major}.x.x versions before bumping to ${major + 1}.0.0.
""")
            }

            // Check if any versions exist in the next major version line or higher
            def existsInNextMajor = allVersions.any { otherVersion ->
                def otherMatcher = otherVersion =~ versionPattern
                if (!otherMatcher.matches()) return false
                def otherMajor = otherMatcher.group(1).toInteger()
                return otherMajor >= (major + 1)
            }

            if (existsInNextMajor) {
                def conflicting = allVersions.findAll { otherVersion ->
                    def otherMatcher = otherVersion =~ versionPattern
                    if (!otherMatcher.matches()) return false
                    def otherMajor = otherMatcher.group(1).toInteger()
                    return otherMajor >= (major + 1)
                }
                throw new GradleException("""
Cannot bump major version: versions already exist in ${major + 1}.x.x line!

Current version: ${currentVersion} (from ancestry)
Requested bump: major → ${newVersion}
Conflicting versions: ${conflicting.sort().take(5).join(', ')}

You must either:
  1. Merge/rebase with the branch containing these versions
  2. Delete conflicting tags if they were created in error
  3. Use manual version override: -PbaseVersion=X.Y.Z
""")
            }

        } else if (bumpType == 'minor') {
            // Check if there are any higher versions in the current minor version line
            def higherInCurrentMinor = allVersions.any { otherVersion ->
                def otherMatcher = otherVersion =~ versionPattern
                if (!otherMatcher.matches()) return false
                def otherMajor = otherMatcher.group(1).toInteger()
                def otherMinor = otherMatcher.group(2).toInteger()
                def otherPatch = otherMatcher.group(3).toInteger()

                return otherMajor == major && otherMinor == minor && otherPatch > patch
            }

            if (higherInCurrentMinor) {
                throw new GradleException("""
Cannot bump minor version: higher patch versions exist in current minor version line!

Current version: ${currentVersion} (from ancestry)
Requested bump: minor → ${newVersion}

Higher versions exist in the ${major}.${minor}.x line that are not in your branch ancestry.
You must merge/rebase to include all ${major}.${minor}.x versions before bumping to ${major}.${minor + 1}.0.
""")
            }

            // Check if any versions exist in higher minor lines or higher major versions
            def existsInHigherMinor = allVersions.any { otherVersion ->
                def otherMatcher = otherVersion =~ versionPattern
                if (!otherMatcher.matches()) return false
                def otherMajor = otherMatcher.group(1).toInteger()
                def otherMinor = otherMatcher.group(2).toInteger()

                return otherMajor > major || (otherMajor == major && otherMinor >= (minor + 1))
            }

            if (existsInHigherMinor) {
                def conflicting = allVersions.findAll { otherVersion ->
                    def otherMatcher = otherVersion =~ versionPattern
                    if (!otherMatcher.matches()) return false
                    def otherMajor = otherMatcher.group(1).toInteger()
                    def otherMinor = otherMatcher.group(2).toInteger()

                    return otherMajor > major || (otherMajor == major && otherMinor >= (minor + 1))
                }
                throw new GradleException("""
Cannot bump minor version: versions already exist in ${major}.${minor + 1}.x line or higher!

Current version: ${currentVersion} (from ancestry)
Requested bump: minor → ${newVersion}
Conflicting versions: ${conflicting.sort().take(5).join(', ')}

You must either:
  1. Merge/rebase with the branch containing these versions
  2. Delete conflicting tags if they were created in error
  3. Use manual version override: -PbaseVersion=X.Y.Z
""")
            }

        } else if (bumpType == 'patch') {
            // For patch, check if the exact version already exists
            if (allVersions.contains(newVersion)) {
                throw new GradleException("""
Cannot bump patch version: ${newVersion} already exists!

Current version: ${currentVersion} (from ancestry)
Requested bump: patch → ${newVersion}

This exact version already exists in the repository.
You must either:
  1. Merge/rebase with the branch containing ${newVersion}
  2. Delete the conflicting tag if it was created in error
  3. Use manual version override: -PbaseVersion=X.Y.Z
""")
            }

            // Also check if there are higher versions that would make this patch invalid
            def higherVersions = allVersions.any { otherVersion ->
                def otherMatcher = otherVersion =~ versionPattern
                if (!otherMatcher.matches()) return false
                def otherMajor = otherMatcher.group(1).toInteger()
                def otherMinor = otherMatcher.group(2).toInteger()
                def otherPatch = otherMatcher.group(3).toInteger()

                return otherMajor > major ||
                       (otherMajor == major && otherMinor > minor) ||
                       (otherMajor == major && otherMinor == minor && otherPatch > patch)
            }

            if (higherVersions) {
                def conflicting = allVersions.findAll { otherVersion ->
                    def otherMatcher = otherVersion =~ versionPattern
                    if (!otherMatcher.matches()) return false
                    def otherMajor = otherMatcher.group(1).toInteger()
                    def otherMinor = otherMatcher.group(2).toInteger()
                    def otherPatch = otherMatcher.group(3).toInteger()

                    return otherMajor > major ||
                           (otherMajor == major && otherMinor > minor) ||
                           (otherMajor == major && otherMinor == minor && otherPatch > patch)
                }
                throw new GradleException("""
Cannot bump patch version: higher versions exist in repository!

Current version: ${currentVersion} (from ancestry)
Requested bump: patch → ${newVersion}
Higher versions: ${conflicting.sort().take(5).join(', ')}

You must merge/rebase to include these higher versions before creating ${newVersion}.
""")
            }
        }

        // Check if there are higher versions elsewhere (informational only)
        def higherVersions = allVersions.findAll { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false

            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()
            def otherPatch = otherMatcher.group(3).toInteger()

            if (otherMajor > major) return true
            if (otherMajor == major && otherMinor > minor) return true
            if (otherMajor == major && otherMinor == minor && otherPatch > patch) return true
            return false
        }
        
        def output = """
✅ Version bumped successfully!

Old version: ${currentVersion} (from ancestry)
New version: ${newVersion}
"""

        if (!higherVersions.isEmpty()) {
            output += """
ℹ️  INFO: Higher versions exist elsewhere in the repository: ${higherVersions.sort().reverse().take(5).join(', ')}
   Current branch ancestry only includes up to ${currentVersion}

"""
        }

        output += """
Next steps:
  1. Create git tag: git tag v${newVersion}
  2. Push tag: git push origin v${newVersion}
  3. Update CHANGELOG: ./gradlew updateChangelog
  4. Build with new version: ./gradlew build

Note: The version is now managed via git tags, not gradle.properties
"""

        println output
    }
}

// Task to interactively bump the semantic version
task bumpVersion {
    group = 'release'
    description = 'Interactively bump the semantic version (major, minor, or patch)'
    
    doLast {
        // Get current version from git tags (only in ancestry)
        def currentVersion = getLatestVersionFromGit()
        
        def versionPattern = /^(\d+)\.(\d+)\.(\d+)$/
        def matcher = currentVersion =~ versionPattern
        
        if (!matcher.matches()) {
            throw new GradleException("Version '${currentVersion}' doesn't match semantic versioning format (X.Y.Z)")
        }
        
        def major = matcher.group(1).toInteger()
        def minor = matcher.group(2).toInteger()
        def patch = matcher.group(3).toInteger()
        
        // Check for higher versions elsewhere in the repository
        def allVersions = getAllVersionTagsFromGit()

        // Determine which version bumps are valid (not conflicting with existing tags)
        def proposedMajor = "${major + 1}.0.0"
        def proposedMinor = "${major}.${minor + 1}.0"
        def proposedPatch = "${major}.${minor}.${patch + 1}"

        // For major version bump: must be the latest version in current major version line
        // AND no versions exist in the next major version line
        def canBumpMajor = true

        // Check if there are any higher versions in the current major version line
        def higherInCurrentMajor = allVersions.any { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false
            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()
            def otherPatch = otherMatcher.group(3).toInteger()

            // Same major version but higher minor or patch
            return otherMajor == major && (otherMinor > minor || (otherMinor == minor && otherPatch > patch))
        }

        // Check if any versions exist in the next major version line or higher
        def existsInNextMajor = allVersions.any { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false
            def otherMajor = otherMatcher.group(1).toInteger()
            return otherMajor >= (major + 1)
        }

        canBumpMajor = !higherInCurrentMajor && !existsInNextMajor

        // For minor version bump: must be the latest version in current minor version line
        // AND no versions exist in higher minor lines of the same major version
        def canBumpMinor = true

        // Check if there are any higher versions in the current minor version line
        def higherInCurrentMinor = allVersions.any { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false
            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()
            def otherPatch = otherMatcher.group(3).toInteger()

            // Same major.minor but higher patch
            return otherMajor == major && otherMinor == minor && otherPatch > patch
        }

        // Check if any versions exist in higher minor lines or higher major versions
        def existsInHigherMinor = allVersions.any { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false
            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()

            return otherMajor > major || (otherMajor == major && otherMinor >= (minor + 1))
        }

        canBumpMinor = !higherInCurrentMinor && !existsInHigherMinor

        // For patch version bump: check if the exact version already exists anywhere
        // OR if there are higher versions in the same minor line or higher
        def canBumpPatch = !allVersions.contains(proposedPatch) && !allVersions.any { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false
            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()
            def otherPatch = otherMatcher.group(3).toInteger()

            // Check if there are higher versions in same minor line or higher
            return otherMajor > major ||
                   (otherMajor == major && otherMinor > minor) ||
                   (otherMajor == major && otherMinor == minor && otherPatch > patch)
        }

        // Find higher versions for warning message
        def higherVersions = allVersions.findAll { otherVersion ->
            def otherMatcher = otherVersion =~ versionPattern
            if (!otherMatcher.matches()) return false

            def otherMajor = otherMatcher.group(1).toInteger()
            def otherMinor = otherMatcher.group(2).toInteger()
            def otherPatch = otherMatcher.group(3).toInteger()

            if (otherMajor > major) return true
            if (otherMajor == major && otherMinor > minor) return true
            if (otherMajor == major && otherMinor == minor && otherPatch > patch) return true
            return false
        }

        def warningMessage = ""
        if (!higherVersions.isEmpty()) {
            warningMessage = """
⚠️  WARNING: Higher versions exist elsewhere in the repository:
   ${higherVersions.sort().reverse().take(5).join(', ')}${higherVersions.size() > 5 ? ' ...' : ''}

   Current branch ancestry only includes up to ${currentVersion}
   Some version bump options are disabled to prevent conflicts.

"""
        }

        // Build menu with letter-based options (consistent regardless of what's available)
        // Show menu even if no options available, so user can see what's blocked and why
        def menuOptions = []
        def optionMap = [:]
        def validOptions = []

        if (canBumpMajor) {
            menuOptions.add("  [J] maJor version (${major}.${minor}.${patch} → ${proposedMajor})")
            optionMap['j'] = ['major', proposedMajor]
            optionMap['J'] = ['major', proposedMajor]
            validOptions.add('J')
        } else {
            menuOptions.add("  [J] maJor version (${major}.${minor}.${patch} → ${proposedMajor}) - UNAVAILABLE")
        }

        if (canBumpMinor) {
            menuOptions.add("  [N] miNor version (${major}.${minor}.${patch} → ${proposedMinor})")
            optionMap['n'] = ['minor', proposedMinor]
            optionMap['N'] = ['minor', proposedMinor]
            validOptions.add('N')
        } else {
            menuOptions.add("  [N] miNor version (${major}.${minor}.${patch} → ${proposedMinor}) - UNAVAILABLE")
        }

        if (canBumpPatch) {
            menuOptions.add("  [P] Patch version (${major}.${minor}.${patch} → ${proposedPatch})")
            optionMap['p'] = ['patch', proposedPatch]
            optionMap['P'] = ['patch', proposedPatch]
            validOptions.add('P')
        } else {
            menuOptions.add("  [P] Patch version (${major}.${minor}.${patch} → ${proposedPatch}) - UNAVAILABLE")
        }

        menuOptions.add("  [C] Cancel")
        optionMap['c'] = null
        optionMap['C'] = null

        println """
╔════════════════════════════════════════════════════════════════╗
║                    Version Bump Utility                        ║
╚════════════════════════════════════════════════════════════════╝

Current version: ${currentVersion} (from ancestry)
${warningMessage}
Select version component to bump:
${menuOptions.join('\n')}

Enter choice [${validOptions.join('/')}${validOptions.isEmpty() ? '' : '/'}C]: """
        
        // Use standard input instead of System.console() for better compatibility
        def reader = new BufferedReader(new InputStreamReader(System.in))
        def choice = reader.readLine()?.trim()
        
        if (!choice) {
            throw new GradleException("No input received. Please run this task in an interactive terminal.")
        }
        
        // Check if user cancelled
        if (choice.toLowerCase() == 'c') {
            println "\nVersion bump cancelled."
            return
        }
        
        // Get the selected version bump
        def selectedOption = optionMap[choice]
        if (selectedOption == null && choice.toLowerCase() != 'c') {
            def validChoices = validOptions.join(', ')
            throw new GradleException("Invalid choice: '${choice}'. Valid options are: ${validChoices}, C")
        }
        
        if (selectedOption == null) {
            println "\nVersion bump cancelled."
            return
        }
        
        def bumpType = selectedOption[0]
        def newVersion = selectedOption[1]

        // Double-check the new version doesn't exist (shouldn't happen with our filtering)
        def versionWarnings = []
        if (allVersions.contains(newVersion)) {
            versionWarnings.add("⚠️  WARNING: Version ${newVersion} already exists in the repository!")
            versionWarnings.add("   This should not happen. Please report this as a bug.")
        }

        def output = """
✅ Version bumped successfully!

Old version: ${currentVersion} (from ancestry)
New version: ${newVersion}
"""

        if (!versionWarnings.isEmpty()) {
            output += "\n" + versionWarnings.join('\n') + "\n"
        }

        output += """
Next steps:
  1. Create git tag: git tag v${newVersion}
  2. Push tag: git push origin v${newVersion}
  3. Update CHANGELOG: ./gradlew updateChangelog
  4. Build with new version: ./gradlew build

Note: The version is now managed via git tags, not gradle.properties
"""

        println output
    }
}

// Task to validate release readiness
task validateRelease {
    group = 'release'
    description = 'Comprehensive validation of release readiness'
    
    doLast {
        def errors = []
        def warnings = []
        
        println """
╔════════════════════════════════════════════════════════════════╗
║                    Release Validation                          ║
╚════════════════════════════════════════════════════════════════╝
"""
        
        // 1. Version format check
        print "Checking version format... "
        def versionPattern = /^\d+\.\d+\.\d+$/
        if (!(version ==~ versionPattern)) {
            errors.add("Version '${version}' doesn't match semantic versioning (X.Y.Z)")
            println "❌"
        } else {
            println "✅ (${version})"
        }
        
        // 2. CHANGELOG check
        print "Checking CHANGELOG.md... "
        def changelogFile = file('CHANGELOG.md')
        if (!changelogFile.exists()) {
            errors.add("CHANGELOG.md not found")
            println "❌"
        } else {
            def changelog = changelogFile.text
            if (!changelog.contains("## [v${version}]") && !changelog.contains("## [${version}]")) {
                errors.add("Version ${version} not found in CHANGELOG.md")
                println "❌"
            } else {
                println "✅"
            }
        }
        
        // 3. Git state check
        print "Checking git working directory... "
        try {
            def gitStatus = 'git status --porcelain'.execute().text.trim()
            if (gitStatus) {
                errors.add("Git working directory not clean")
                println "❌"
            } else {
                println "✅"
            }
        } catch (Exception e) {
            errors.add("Unable to check git status: ${e.message}")
            println "❌"
        }
        
        // 4. Git tag check
        print "Checking for existing tag v${version}... "
        try {
            def checkTag = "git rev-parse --verify v${version}".execute()
            checkTag.waitFor()
            if (checkTag.exitValue() == 0) {
                errors.add("Git tag v${version} already exists")
                println "❌"
            } else {
                println "✅"
            }
        } catch (Exception e) {
            println "✅"
        }
        
        // 5. Branch check
        print "Checking current branch... "
        def currentBranch = null
        try {
            currentBranch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
            if (currentBranch == 'main') {
                println "✅ (${currentBranch})"
            } else if (currentBranch.startsWith('release/')) {
                println "✅ (${currentBranch})"
            } else {
                warnings.add("Not on main or release branch (current: ${currentBranch})")
                println "⚠️  (${currentBranch})"
            }
        } catch (Exception e) {
            warnings.add("Unable to check branch: ${e.message}")
            println "⚠️"
        }
        
        // 5b. Branch sync check (for release branches)
        if (currentBranch && currentBranch.startsWith('release/')) {
            print "Checking branch sync with origin... "
            try {
                // Fetch to ensure we have latest remote info
                exec {
                    commandLine 'git', 'fetch', 'origin', currentBranch
                    standardOutput = new ByteArrayOutputStream()
                    errorOutput = new ByteArrayOutputStream()
                }
                
                def localCommit = "git rev-parse HEAD".execute().text.trim()
                def remoteCommit = "git rev-parse origin/${currentBranch}".execute().text.trim()
                
                if (localCommit == remoteCommit) {
                    println "✅ (in sync)"
                } else {
                    errors.add("Local branch ${currentBranch} is not in sync with origin/${currentBranch}. Push your changes first.")
                    println "❌"
                }
            } catch (Exception e) {
                warnings.add("Unable to check branch sync: ${e.message}")
                println "⚠️"
            }
            
            // 5c. Check release branch is based on current origin/main
            print "Checking release branch is based on origin/main... "
            try {
                // Fetch main to ensure we have latest
                exec {
                    commandLine 'git', 'fetch', 'origin', 'main'
                    standardOutput = new ByteArrayOutputStream()
                    errorOutput = new ByteArrayOutputStream()
                }
                
                // Find merge-base between current branch and origin/main
                def mergeBase = "git merge-base HEAD origin/main".execute().text.trim()
                def originMain = "git rev-parse origin/main".execute().text.trim()
                
                if (mergeBase == originMain) {
                    println "✅ (based on current origin/main)"
                } else {
                    errors.add("Release branch ${currentBranch} is not based on current origin/main. Rebase or recreate from latest main.")
                    println "❌"
                }
            } catch (Exception e) {
                warnings.add("Unable to check branch base: ${e.message}")
                println "⚠️"
            }
        }
        
        // 6. GitHub CLI check
        print "Checking GitHub CLI... "
        try {
            exec {
                commandLine 'gh', '--version'
                standardOutput = new ByteArrayOutputStream()
            }
            println "✅"
        } catch (Exception e) {
            errors.add("GitHub CLI (gh) not found")
            println "❌"
        }
        
        // 7. GitHub auth check
        print "Checking GitHub authentication... "
        def hasToken = System.getenv('GH_TOKEN') != null
        def hasAuth = false
        try {
            def authStatus = 'gh auth status'.execute()
            authStatus.waitFor()
            hasAuth = authStatus.exitValue() == 0
        } catch (Exception e) {
            // Ignore
        }
        
        if (hasToken || hasAuth) {
            println "✅"
            
            // 8. GitHub release check
            print "Checking for existing GitHub release... "
            try {
                def checkRelease = "gh release view v${version}".execute()
                def output = new ByteArrayOutputStream()
                checkRelease.consumeProcessOutput(output, output)
                checkRelease.waitFor()
                if (checkRelease.exitValue() == 0) {
                    errors.add("GitHub release v${version} already exists")
                    println "❌"
                } else {
                    println "✅"
                }
            } catch (Exception e) {
                println "✅"
            }
        } else {
            errors.add("GitHub authentication not configured")
            println "❌"
        }
        
        // 9. Test results check
        print "Checking test results... "
        def testResults = fileTree("${buildDir}/test-results").matching { include '**/*.xml' }
        if (testResults.isEmpty()) {
            warnings.add("No test results found. Run './gradlew test' first")
            println "⚠️"
        } else {
            println "✅"
        }
        
        println ""
        
        if (warnings) {
            println "⚠️  Warnings:"
            warnings.each { println "  - ${it}" }
            println ""
        }
        
        if (errors) {
            println "❌ Validation Failed:"
            errors.each { println "  - ${it}" }
            println ""
            throw new GradleException("Release validation failed. Fix the errors above and try again.")
        }
        
        println "✅ All validation checks passed!"
        println "   Ready to release version ${version}"
        println ""
    }
}

// Task to create release branch and prepare release
task prepareReleaseBranch {
    group = 'release'
    description = 'Creates a release branch, updates CHANGELOG, and pushes to origin'
    
    doLast {
        def versionTag = "v${version}"
        def releaseBranch = "release/${version}"
        
        println "Preparing release branch: ${releaseBranch}"
        println "Version tag: ${versionTag}"
        
        // Check for clean git state
        def gitStatus = 'git status --porcelain'.execute().text.trim()
        if (gitStatus) {
            throw new GradleException("Git working directory is not clean. Commit or stash changes first.")
        }
        
        // Create release branch
        println "Creating release branch..."
        exec {
            commandLine 'git', 'checkout', '-b', releaseBranch
        }
        
        // Push release branch to origin
        println "Pushing release branch to origin..."
        exec {
            commandLine 'git', 'push', '-u', 'origin', releaseBranch
        }
        
        // Update CHANGELOG using git-cliff, preserving existing entries
        println "Updating CHANGELOG.md..."
        exec {
            commandLine 'git-cliff', '--config', 'config/git-cliff/cliff.toml', '--tag', versionTag, '--unreleased', '--prepend', 'CHANGELOG.md'
        }
        
        // Commit CHANGELOG if changed
        def changelogDiff = 'git diff CHANGELOG.md'.execute().text.trim()
        if (changelogDiff) {
            println "Committing CHANGELOG changes..."
            exec {
                commandLine 'git', 'add', 'CHANGELOG.md'
            }
            exec {
                commandLine 'git', 'commit', '-m', "chore: update CHANGELOG for ${version}"
            }
            exec {
                commandLine 'git', 'push', 'origin', releaseBranch
            }
        } else {
            println "CHANGELOG.md unchanged"
        }
        
        println """
╔════════════════════════════════════════════════════════════════╗
║              Release Branch Prepared Successfully              ║
╚════════════════════════════════════════════════════════════════╝

Branch: ${releaseBranch}
Version: ${releaseVersion}
Tag: ${versionTag}

Next steps:
  1. Review the CHANGELOG.md changes
  2. Run: ./gradlew finalizeRelease -PreleaseVersion=${releaseVersion}
  3. Or manually:
     - Create annotated tag: git tag -a ${versionTag} -m "Release ${version}"
     - Push tag: git push origin ${versionTag}
     - Merge to main: git checkout main && git merge --ff-only ${releaseBranch}
     - Push main: git push origin main
     - Delete branch: git push origin --delete ${releaseBranch}

"""
    }
}

// Task to finalize release (tag, merge, cleanup)
task finalizeRelease {
    group = 'release'
    description = 'Creates annotated tag, merges release branch to main, and cleans up'
    
    doLast {
        // Get version from parameter        
        def releaseVersion = "${version}"
        def versionTag = "v${releaseVersion}"
        def releaseBranch = "release/${releaseVersion}"
        
        println "Finalizing release: ${releaseVersion}"
        
        // Verify we're on the release branch
        def currentBranch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
        if (currentBranch != releaseBranch) {
            throw new GradleException("Must be on ${releaseBranch} branch. Current branch: ${currentBranch}")
        }
        
        // Create annotated tag
        println "Creating annotated tag: ${versionTag}"
        exec {
            commandLine 'git', 'tag', '-a', versionTag, '-m', "Release ${releaseVersion}"
        }
        
        // Push tag
        println "Pushing tag to origin..."
        exec {
            commandLine 'git', 'push', 'origin', versionTag
        }
        
        // Checkout main
        println "Checking out main branch..."
        exec {
            commandLine 'git', 'checkout', 'main'
        }
        
        // Pull latest main
        println "Pulling latest main..."
        exec {
            commandLine 'git', 'pull', 'origin', 'main'
        }
        
        // Fast-forward merge release branch
        println "Merging ${releaseBranch} to main (fast-forward only)..."
        exec {
            commandLine 'git', 'merge', '--ff-only', releaseBranch
        }
        
        // Push main
        println "Pushing main to origin..."
        exec {
            commandLine 'git', 'push', 'origin', 'main'
        }
        
        // Delete remote release branch
        println "Deleting remote release branch..."
        exec {
            commandLine 'git', 'push', 'origin', '--delete', releaseBranch
        }
        
        // Delete local release branch
        println "Deleting local release branch..."
        exec {
            commandLine 'git', 'branch', '-d', releaseBranch
        }
        
        println """
╔════════════════════════════════════════════════════════════════╗
║                  Release Finalized Successfully                ║
╚════════════════════════════════════════════════════════════════╝

Version: ${releaseVersion}
Tag: ${versionTag}
Branch: ${releaseBranch} (deleted)

The release branch has been merged to main and cleaned up.

Next steps:
  1. Verify the release at: https://github.com/OpenLiberty/yoko/releases/tag/${versionTag}
  2. Or create the GitHub release manually using: ./gradlew createGitHubRelease

"""
    }
}

// Task to generate release notes from CHANGELOG
task generateReleaseNotes {
    group = 'release'
    description = 'Generates release notes from CHANGELOG.md'

    dependsOn assembleRelease
    
    def changelogFile = file('CHANGELOG.md')
    def releaseNotesFile = file("${buildDir}/release/RELEASE_NOTES.md")
    
    inputs.file changelogFile
    outputs.file releaseNotesFile
    
    doLast {
        if (!changelogFile.exists()) {
            throw new GradleException("CHANGELOG.md not found")
        }
        
        def changelog = changelogFile.text
        def versionPattern = /## \[v?(\d+\.\d+\.\d+[^\]]*)\]/
        def matcher = changelog =~ versionPattern
        
        if (!matcher.find()) {
            throw new GradleException("No version found in CHANGELOG.md")
        }
        
        def latestVersion = matcher.group(1)
        def startIdx = matcher.start()
        
        // Find next version or end of file
        def nextMatcher = changelog.substring(startIdx + 1) =~ versionPattern
        def endIdx = nextMatcher.find() ? 
            startIdx + 1 + nextMatcher.start() : 
            changelog.length()
        
        def releaseNotes = changelog.substring(startIdx, endIdx).trim()
        
        releaseNotesFile.parentFile.mkdirs()
        releaseNotesFile.text = """# Yoko ${latestVersion}

${releaseNotes}

## 📦 Artifacts

This release includes the following artifacts:

${releaseProjects.collect { projectPath ->
    def proj = project(projectPath)
    "- `${proj.name}-${version}.jar` - Main library\n" +
    "- `${proj.name}-${version}-sources.jar` - Source code\n" +
    "- `${proj.name}-${version}-javadoc.jar` - API documentation"
}.join('\n')}

## 🔐 Checksums

SHA-256 and SHA-512 checksums are provided for all artifacts.

## 📚 Documentation

For more information, see the [Yoko documentation](https://openliberty.github.io/yoko/).
"""
        
        println "Release notes generated: ${releaseNotesFile}"
        println "Version: ${latestVersion}"
    }
}

// Task to create distribution archive
task createDistribution(type: Zip) {
    group = 'release'
    description = 'Creates a distribution archive with all artifacts'
    
    dependsOn generateReleaseNotes
    
    archiveBaseName = 'yoko'
    archiveVersion = version
    archiveClassifier = 'dist'
    destinationDirectory = file("${buildDir}/distributions")
    
    from("${buildDir}/release") {
        include '*.jar'
        include '*.sha256'
        include '*.sha512'
        include 'RELEASE_NOTES.md'
    }
    
    from(rootDir) {
        include 'LICENSE'
        include 'NOTICE'
        include 'README.md'
        include 'CHANGELOG.md'
    }
    
    doLast {
        println "Distribution created: ${archiveFile.get()}"
    }
}

// Task to create GitHub release using GitHub CLI
task createGitHubRelease {
    group = 'release'
    description = 'Creates a GitHub release with artifacts (requires gh CLI and GH_TOKEN)'
    
    dependsOn createDistribution
    
    doLast {
        // Check if gh CLI is available
        try {
            exec {
                commandLine 'gh', '--version'
                standardOutput = new ByteArrayOutputStream()
            }
        } catch (Exception e) {
            throw new GradleException("GitHub CLI (gh) not found. Install from: https://cli.github.com/")
        }
        
        def releaseNotesFile = file("${buildDir}/release/RELEASE_NOTES.md")
        def releaseDir = file("${buildDir}/release")
        
        // Get the actual distribution file created by createDistribution task
        def distTask = tasks.getByName('createDistribution')
        def distFile = distTask.archiveFile.get().asFile
        
        // Extract version from CHANGELOG
        def changelog = file('CHANGELOG.md').text
        def versionMatcher = changelog =~ /## \[v?(\d+\.\d+\.\d+[^\]]*)\]/
        if (!versionMatcher.find()) {
            throw new GradleException("No version found in CHANGELOG.md")
        }
        def releaseVersion = "v${versionMatcher.group(1)}"
        
        // Check if tag already exists
        try {
            def checkTag = "git rev-parse --verify ${releaseVersion}".execute()
            checkTag.waitFor()
            if (checkTag.exitValue() == 0) {
                throw new GradleException("Git tag ${releaseVersion} already exists. Roll it back manually to re-release or bump the version using 'gradle bumpVersion'")
            }
        } catch (IOException e) {
            // Tag doesn't exist, which is good
        }

        // Check if GitHub release already exists
        try {
            def checkRelease = "gh release view ${releaseVersion}".execute()
            def output = new ByteArrayOutputStream()
            checkRelease.consumeProcessOutput(output, output)
            checkRelease.waitFor()
            if (checkRelease.exitValue() == 0) {
                throw new GradleException("GitHub release ${releaseVersion} already exists. Remove it, or bump the version in gradle.properties")
            }
        } catch (IOException e) {
            // Release doesn't exist, which is good
        }

        println "Creating GitHub release: ${releaseVersion}"
        
        // Get current commit hash to use as target (not branch name)
        def currentCommit = 'git rev-parse HEAD'.execute().text.trim()
        def currentBranch = 'git rev-parse --abbrev-ref HEAD'.execute().text.trim()
        println "Creating release from branch: ${currentBranch}"
        println "Tagging commit: ${currentCommit.take(10)}"
        
        // Create release using current HEAD commit as target
        def createCmd = [
            'gh', 'release', 'create', releaseVersion,
            '--title', "Yoko ${releaseVersion}",
            '--notes-file', releaseNotesFile.absolutePath,
            '--target', currentCommit
        ]
        
        // Add all JAR files
        fileTree(releaseDir).matching { 
            include '*.jar'
            include '*.sha256'
            include '*.sha512'
        }.each { file ->
            createCmd.add(file.absolutePath)
        }
        
        // Add distribution archive
        createCmd.add(distFile.absolutePath)
        
        exec {
            commandLine createCmd
        }
        
        println "✅ GitHub release created successfully: ${releaseVersion}"
        println "View at: https://github.com/OpenLiberty/yoko/releases/tag/${releaseVersion}"
    }
}

// Main release task
task release {
    group = 'release'
    description = 'Complete release process: validate, build, and create GitHub release'

    dependsOn 'validateRelease'
    dependsOn 'createGitHubRelease'
    
    // Ensure validateRelease runs before createGitHubRelease
    tasks.createGitHubRelease.mustRunAfter tasks.validateRelease

    doFirst {
        println """
╔════════════════════════════════════════════════════════════════╗
║                  Starting Release Process                      ║
╚════════════════════════════════════════════════════════════════╝

Version: ${version}
Tag: v${version}

"""
    }
    
    doLast {
        println """
╔════════════════════════════════════════════════════════════════╗
║                    🎉 Release Complete! 🎉                     ║
╚════════════════════════════════════════════════════════════════╝

Version: ${version}
Tag: v${version}
Release URL: https://github.com/OpenLiberty/yoko/releases/tag/v${version}

Next steps:
  1. Verify the release artifacts on GitHub
  2. Test the release by downloading and verifying checksums
  3. Update documentation if needed
  4. Announce the release

"""
    }
}

// Add sources and javadoc JAR tasks to release projects
configure(releaseProjects.collect { project(it) }) {
    afterEvaluate {
        task sourcesJar(type: Jar) {
            archiveClassifier = 'sources'
            from sourceSets.main.allSource
        }
        
        task javadocJar(type: Jar) {
            archiveClassifier = 'javadoc'
            from javadoc.destinationDir
            dependsOn javadoc
        }
        
        artifacts {
            archives sourcesJar
            archives javadocJar
        }
    }
}

